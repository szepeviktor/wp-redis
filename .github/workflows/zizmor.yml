# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Lint
on:
  workflow_dispatch: null

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required for codeql-action/upload-sarif to upload SARIF files.
      contents: read         # Only needed for private repos. Needed to clone the repo.
      actions: read          # Only needed for private repos. Needed for codeql-action/upload-sarif to read workflow run info.
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Run zizmor
        run: uvx zizmor@1.25.2 --persona=auditor--strict-collection .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
